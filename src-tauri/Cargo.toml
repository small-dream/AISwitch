[package]
name = "jakeaitools"
version = "0.1.0"
description = "One-click model switching for Claude Code and Codex CLI"
edition = "2021"

[lib]
name = "jakeaitools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
