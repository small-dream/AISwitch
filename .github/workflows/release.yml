name: Release

# 推送 v* 标签触发：先升 package.json 与 tauri.conf.json 的 version，再
# git tag vX.Y.Z && git push origin vX.Y.Z。产物先进入 Draft Release，
# 人工核对后再发布。
on:
  push:
    tags: ['v*']

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AISwitch ${{ github.ref_name }}'
          releaseBody: |
            > [!WARNING]
            > **Installers are unsigned.** To install:
            > - **macOS**: drag into `Applications`, then run `xattr -cr /Applications/AISwitch.app`
            >   (or right-click the app → *Open* the first time) to pass Gatekeeper.
            > - **Windows**: if SmartScreen appears, click *More info* → *Run anyway*,
            >   or run `Unblock-File .\AISwitch_*_x64-setup.exe` in PowerShell first.
            > - **Linux**: `.deb` / `.AppImage` install directly without prompts.
            >
            > **安装包未签名。** 安装方式：
            > - **macOS**：拖入「应用程序」后执行 `xattr -cr /Applications/AISwitch.app`
            >   （或首次右键→「打开」）以通过 Gatekeeper；
            > - **Windows**：若出现 SmartScreen 提示，点「更多信息」→「仍要运行」，
            >   或先在 PowerShell 执行 `Unblock-File .\AISwitch_*_x64-setup.exe`；
            > - **Linux**：`.deb` / `.AppImage` 可直接安装，无拦截提示。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
