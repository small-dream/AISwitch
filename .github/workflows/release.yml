name: Release

# Push a vX.Y.Z tag after updating both version files and CHANGELOG.md.
# The workflow validates the release notes, uploads signed updater artifacts,
# then publishes one complete release.
on:
  push:
    tags: ['v*']

jobs:
  # 先单独创建唯一的 draft release，再由 matrix 上传，避免各 job 竞态。
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$TAG"
      - name: Create release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          body=$(node scripts/release-notes.mjs "$TAG")
          body="$body
          $(cat <<'EOF'
          > [!WARNING]
          > **Installers are unsigned.** To install:
          > - **macOS**: drag into `Applications`, then run `xattr -cr /Applications/AISwitch.app`
          >   (or right-click the app → *Open* the first time) to pass Gatekeeper.
          > - **Windows**: if SmartScreen appears, click *More info* → *Run anyway*,
          >   or run `Unblock-File .\AISwitch_*_x64-setup.exe` in PowerShell first.
          > - **Linux**: `.deb` / `.AppImage` install directly without prompts.
          >
          > **安装包未签名。** 安装方式：
          > - **macOS**：拖入「应用程序」后执行 `xattr -cr /Applications/AISwitch.app`
          >   （或首次右键→「打开」）以通过 Gatekeeper；
          > - **Windows**：若出现 SmartScreen 提示，点「更多信息」→「仍要运行」，
          >   或先在 PowerShell 执行 `Unblock-File .\AISwitch_*_x64-setup.exe`；
          > - **Linux**：`.deb` / `.AppImage` 可直接安装，无拦截提示。
          EOF
          )"
          # 优先复用已存在的 release（按 tag 查询）；不存在则用 API 创建，
          # 响应自带 id。id 必须校验为纯数字——gh api 的错误 JSON 走标准
          # 输出，捕获后会是 {"message":"Not Found",...} 这样的垃圾值。
          release_id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id' 2>/dev/null \
            | grep -E '^[0-9]+$' || true)
          if [ -z "$release_id" ]; then
            release_id=$(gh api --method POST "repos/$REPO/releases" \
              -f tag_name="$TAG" -f name="AISwitch $TAG" -f body="$body" -F draft=true \
              --jq '.id')
          else
            gh api --method PATCH "repos/$REPO/releases/$release_id" \
              -f body="$body" -F draft=true >/dev/null
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 统一上传到 create-release 建好的 draft，避免竞态重复建 release
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true

  publish-release:
    needs: publish-tauri
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          release_id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id')
          gh api --method PATCH "repos/$REPO/releases/$release_id" -F draft=false >/dev/null
