<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>AISwitch</title>
    <script>
      // 首帧前应用主题，避免亮色闪烁（与 theme-store 的存储键一致）
      document.documentElement.classList.toggle(
        'dark',
        (localStorage.getItem('jake.theme') ?? 'dark') !== 'light'
      )
      // 首帧前同步 <html lang>（与 locale-store 的解析规则一致：存储优先，否则跟随系统语言）
      var savedLocale = localStorage.getItem('jake.locale')
      document.documentElement.lang =
        savedLocale === 'en' || savedLocale === 'zh-CN'
          ? savedLocale
          : (navigator.language || 'zh-CN').toLowerCase().startsWith('zh')
            ? 'zh-CN'
            : 'en'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
